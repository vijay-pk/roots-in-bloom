<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3328" />
      <stop offset="100%" stop-color="#192018" />
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e87a5d" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#192018" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg3)" rx="24" />
  <circle cx="300" cy="260" r="180" fill="url(#glow2)" />
  
  <!-- Receding hairline / patchy crown silhouette -->
  <circle cx="300" cy="230" r="110" fill="#364234" stroke="#4a5948" stroke-width="3" />
  <path d="M 220 220 Q 240 180 270 190 Q 300 220 330 190 Q 360 180 380 220" fill="none" stroke="#7a8c77" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  <circle cx="300" cy="180" r="30" fill="#e87a5d" fill-opacity="0.15" stroke="#e87a5d" stroke-width="2" stroke-dasharray="4,4" />
  <text x="300" y="185" fill="#e87a5d" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="600">Hairline Loss</text>

  <!-- Bottom Badge -->
  <rect x="180" y="470" width="240" height="50" rx="25" fill="#e87a5d" fill-opacity="0.2" stroke="#e87a5d" stroke-width="1.5" />
  <text x="300" y="501" fill="#f5ebe1" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle" letter-spacing="2">BEFORE (WEEK 0)</text>
  <text x="300" y="550" fill="#a3b8a1" font-size="14" font-family="system-ui, sans-serif" text-anchor="middle">Replace with your Person 2 Before Photo</text>
